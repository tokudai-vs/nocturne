<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#e5a00d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <g transform="translate(256,256)">
    <!-- Moon crescent -->
    <circle cx="-20" cy="-20" r="110" fill="url(#accent)"/>
    <circle cx="30" cy="-50" r="90" fill="url(#bg)"/>
    <!-- Stars -->
    <circle cx="80" cy="-80" r="6" fill="#e5a00d" opacity="0.9"/>
    <circle cx="100" cy="-40" r="4" fill="#e5a00d" opacity="0.7"/>
    <circle cx="60" cy="-110" r="3" fill="#e5a00d" opacity="0.5"/>
    <!-- Play triangle -->
    <polygon points="-10,50 -10,120 50,85" fill="url(#accent)" opacity="0.85"/>
  </g>
</svg>
