# Nocturne key bindings
ESC stop
q stop
SPACE cycle pause
LEFT seek -10
RIGHT seek 10
SHIFT+LEFT seek -30
SHIFT+RIGHT seek 30
UP add volume 5
DOWN add volume -5
m cycle mute
s cycle sub
S cycle sub down
a cycle audio
f cycle fullscreen
MBTN_LEFT_DBL cycle fullscreen
[ multiply speed 0.9
] multiply speed 1.1
BS set speed 1.0
