# Nocturne key bindings
ESC stop
q stop
SPACE cycle pause
LEFT seek -10
RIGHT seek 10
SHIFT+LEFT seek -30
SHIFT+RIGHT seek 30
UP add volume 5
DOWN add volume -5
m cycle mute
s cycle sub
S cycle sub down
a cycle audio
f cycle fullscreen
MBTN_LEFT_DBL cycle fullscreen
[ multiply speed 0.9
] multiply speed 1.1
BS set speed 1.0
z add sub-delay -0.1
Z add sub-delay 0.1
r add sub-pos -1
R add sub-pos 1
Alt+UP add sub-font-size 2
Alt+DOWN add sub-font-size -2
# Subtitle download (handled by open-subtitles.lua)
# b = search & download subtitles from OpenSubtitles
