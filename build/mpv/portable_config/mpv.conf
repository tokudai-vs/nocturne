# Nocturne mpv config

# Disable default OSC (ModernZ replaces it)
osc=no
osd-bar=no
border=no

# Video
vo=gpu-next
gpu-api=d3d11
hwdec=auto-safe
tone-mapping=auto
target-colorspace-hint=yes

# Audio
audio-device=auto
volume=100
volume-max=150

# Playback
keep-open=yes
cursor-autohide=1000

# Cache
cache=yes
demuxer-max-bytes=50M

# OSD font
osd-font=Segoe UI
osd-font-size=24

# Quiet
really-quiet=yes
