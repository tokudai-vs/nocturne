# Layout
layout=modern-compact
icon_theme=fluent
icon_style=mixed

# Seekbar — amber accent (#e5a00d)
seekbarfg_color=#e5a00d
seekbarbg_color=#333333
seekbar_cache_color=#555555
seekbarhandlesize=1.0

# Colors — white buttons, white text
iconcolor=#FFFFFF
buttoncolor=#FFFFFF
hovereffect=yes
hover_effect_color=#e5a00d

# Titles
title=${media-title}
showtitle=yes
showontop=yes
titlefontsize=24

# Scaling
vidscale=no
scalewindowed=1.2
scalefullscreen=1.2

# Timing
hidetimeout=3000
fadeduration=200

# Controls
timetotal=yes
timems=no
unicodeminus=yes
jump_amount=10
jump_icon_number=yes
chapter_skip_buttons=yes
volume_control=yes

# Window
windowcontrols=no
fullscreen_button=no
showwindowed=yes
showfullscreen=yes
showonpause=yes

# Visibility
visibility=auto

# Custom selectors (override mpv's built-in select.lua with anchored ASS menu).
# Script id is `nocturne_select` (mpv replaces `-` in filenames with `_`).
audio_track_mbtn_left_command=script-binding nocturne_select/select-aid
sub_track_mbtn_left_command=script-binding nocturne_select/select-sid
playlist_mbtn_left_command=script-binding nocturne_select/select-playlist
playlist_mbtn_right_command=script-binding nocturne_select/select-playlist
playlist_prev_mbtn_right_command=script-binding nocturne_select/select-playlist
playlist_next_mbtn_right_command=script-binding nocturne_select/select-playlist
